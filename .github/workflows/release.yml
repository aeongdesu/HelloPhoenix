name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
              echo "::error::Please add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS on /settings/secrets/actions"
              exit 1
            fi
          fi

          if [ -n "$KEYSTORE_BASE64" ]; then
            keystore_path="$RUNNER_TEMP/aeong.jks"
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$keystore_path"
            chmod 600 "$keystore_path"
            echo "SIGNING_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"
          fi

      - name: Test and build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle_args=(--no-daemon testDebugUnitTest assembleRelease)
          version_code="$(git rev-list --count HEAD)"
          if [ -n "$version_code" ] && [ "$version_code" -gt 0 ] 2>/dev/null; then
            gradle_args+=("-PversionCode=$version_code")
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            gradle_args+=("-PversionName=${GITHUB_REF_NAME#v}")
          fi
          ./gradlew "${gradle_args[@]}"

      - name: Verify and stage APK
        id: package
        run: |
          set -euo pipefail
          dist_dir="$RUNNER_TEMP/dist"
          mkdir -p "$dist_dir"
          signed_apk="app/build/outputs/apk/release/app-release.apk"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -f "$signed_apk" ]; then
            "$sdk_root/build-tools/37.0.0/apksigner" verify --verbose "$signed_apk"
            if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
              out_apk="$dist_dir/HelloPhoenix-${GITHUB_REF_NAME}.apk"
            else
              out_apk="$dist_dir/HelloPhoenix-ci-${GITHUB_SHA::7}.apk"
            fi
            cp "$signed_apk" "$out_apk"
          elif [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            echo "::error::Expected signed release APK at $signed_apk"
            exit 1
          else
            out_apk="$dist_dir/HelloPhoenix-ci-${GITHUB_SHA::7}-unsigned.apk"
            cp "$unsigned_apk" "$out_apk"
          fi

          echo "apk_path=$out_apk" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aeong.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.apk_path }}
          archive: false

      - name: Attest artifact
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.apk_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: ${{ steps.package.outputs.apk_path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
